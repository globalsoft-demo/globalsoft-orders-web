# Two-phase security gates (brief Part 3, Task 2).
#   Phase 1 — jf audit: scans the source dependency graph BEFORE anything is built, so a
#             known-bad dependency fails the run in seconds, before it reaches a binary.
#   Phase 2 — jf build-scan: scans what was actually built and published (build-info:
#             artifacts + resolved dependencies), catching what only exists after the build.
# Authentication: OIDC. GitHub mints a short-lived identity token; JFrog exchanges it for a
# 1-hour token scoped to the `ci-pipeline` role of the globalsoft-migration project
# (Terraform: platform_oidc_identity_mapping.ci). No JFrog secret is stored in GitHub.
name: security-gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write # required to request the OIDC token
  contents: read

env:
  JF_URL: ${{ vars.JF_URL }} # https://<instance>.jfrog.io (repository variable, not a secret)
  JF_PROJECT: globalsoft-migration
  BUILD_NAME: globalsoft-orders-web # must be listed in xray_binary_manager_builds (Terraform)

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JFrog CLI via OIDC
        uses: jfrog/setup-jfrog-cli@v5
        with:
          oidc-provider-name: github-actions-globalsoft
          oidc-audience: jfrog-github # must match the audience of the JFrog OIDC integration
          disable-auto-build-publish: true # our build-info is published explicitly below

      - name: Resolve through the project virtual, deploy to the project DEV local
        run: jf npm-config --repo-resolve=company-npm --repo-deploy=globalsoft-migration-orders-npm-dev-local

      # Needs package-lock.json in the repository: without it `npm ls` fails, jf audit sees no
      # dependencies and passes (found while building this demo, 21 Nov).
      - name: "Phase 1 · jf audit (source dependencies)"
        run: jf audit --project "$JF_PROJECT"

      - name: Build and publish (dependencies and artifact recorded in build-info)
        run: |
          # One version per run. The ci-pipeline role cannot overwrite a different file with the same
          # version (403, by design); a re-run of the same commit produces identical bytes, which is allowed.
          npm version "1.1.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          jf npm ci      --build-name="$BUILD_NAME" --build-number="$GITHUB_RUN_NUMBER" --project="$JF_PROJECT"
          jf npm publish --build-name="$BUILD_NAME" --build-number="$GITHUB_RUN_NUMBER" --project="$JF_PROJECT"
          jf rt build-collect-env "$BUILD_NAME" "$GITHUB_RUN_NUMBER" --project="$JF_PROJECT"
          jf rt build-add-git     "$BUILD_NAME" "$GITHUB_RUN_NUMBER" --project="$JF_PROJECT"
          jf rt build-publish     "$BUILD_NAME" "$GITHUB_RUN_NUMBER" --project="$JF_PROJECT"

      - name: "Phase 2 · jf build-scan (what was built)"
        run: jf build-scan "$BUILD_NAME" "$GITHUB_RUN_NUMBER" --project="$JF_PROJECT"

      # SBOM of what this run resolved (CycloneDX, with hashes), kept as a run artifact.
      # Not from Xray here on purpose: Xray's SBOM export and `jf audit --format=cyclonedx` need a
      # platform-level permission (entitlements/export), and the CI token is project-scoped by design
      # (403 even with every project security action, tested 21 Nov). The Xray SBOM of the scanned
      # build is exported from the platform by Security (brief Part 3, Task 4).
      - name: SBOM (CycloneDX) of the resolved dependencies
        if: always()
        run: npm sbom --sbom-format cyclonedx --omit dev --package-lock-only > sbom.cdx.json # works also when the build was skipped

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
