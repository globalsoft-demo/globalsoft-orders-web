# Frogbot (brief Part 3, Task 3): comments on the pull request with the vulnerable dependency,
# the CVE and the fixed version. It is the last line of defence before merge: the IDE and the
# CI gates catch issues earlier; Frogbot blocks the bypass of a PR merged without a CI run.
#
# Trigger: `pull_request_target` (JFrog's recommended trigger). GitHub runs THIS file as it is on
# main, never the PR's copy. That matters because uploading Frogbot V3's scan results needs an
# admin token on this JFrog SaaS: the OIDC identity mapping `globalsoft-frogbot` (Terraform,
# shiftleft.tf) issues it only when job_workflow_ref is this file @refs/heads/main, for 1 hour.
# A pull request cannot change this workflow to obtain the token, and Frogbot V3 analyses the PR
# statically (no npm install of the PR's code). No JFrog secret is stored in GitHub.
# Frogbot V3 is configured from the JFrog Platform (Config Profiles); the first scan switches
# this repository to V3 mode permanently (JFrog docs).
name: frogbot-scan-pull-request

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  id-token: write # OIDC
  pull-requests: write # PR comment
  contents: read
  security-events: write

jobs:
  scan-pull-request:
    runs-on: ubuntu-latest
    steps:
      - uses: jfrog/frogbot@b521695f6cce0ffb639163db14cc498db9274b95 # v3.8.3 (pinned: third-party action that receives an admin token)
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          oidc-provider-name: github-actions-globalsoft
          oidc-audience: jfrog-github
